<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>CampusBite</title>
  <link rel="stylesheet" href="style.css">

</head>


<body>
  <h1>CampusBite</h1>
  <p>Track your Purdue meal swipes and Dining Dollars!</p>

  <hr>

  <h2>Your Dashboard</h2>


  <div class="dashboard-card">
    <h3>Meal Swipes Remaining</h3>
    <p id="swipes">0</p>
    <button id="useSwipe">Use 1 Meal Swipe</button>
  </div>



  <div class="dashboard-card">
    <h3>Dining Dollars Remaining</h3>
    <p id="dollars">$0.00</p>
  </div>


  <h3>Record a Dining Dollar Purchase</h3>

  <form id="purchaseForm">
    <label for="purchaseAmount">Amount Spent ($):</label>
    <input type="number" id="purchaseAmount" min="0.01" step="0.01" required>

    <button type="submit">Record Purchase</button>
  </form>




  <div class="dashboard-card">
    <h3>Suggested Daily Budget</h3>
    <p id="budget">$0.00</p>
  </div>



  <hr>

  <h2>Set Up Your Meal Plan</h2>

  <form id="setupForm">
    <label for="startingSwipes">Starting Meal Swipes:</label>
    <input type="number" id="startingSwipes" min="0" required>

    <br><br>

    <label for="startingDollars">Starting Dining Dollars:</label>
    <input type="number" id="startingDollars" min="0" step="0.01" required>

    <br><br>

    <label for="endDate">Semester End Date:</label>
    <input type="date" id="endDate" required>

    <br><br>

    <button type="submit">Save Meal Plan</button>
  </form>


  <hr>


  <h2>Transaction History</h2>
  <ul id="transactionList"></ul>


  <script src="script.js"></script>

</body>


</html>
